name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Syntax check
        # node --check takes one file; extra arguments become script args and go unchecked
        run: for f in index.js $(find src test -name '*.js'); do node --check "$f"; done

      - name: Smoke test ESM imports
        # loading every module catches imports of names that no longer exist
        run: for f in $(find src -name '*.js'); do node --input-type=module -e "await import('./$f')"; done

      - name: Tests
        run: npm test

