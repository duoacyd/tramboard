services:
  tram-display:
    container_name: brno-tram-display
    build: .
    restart: unless-stopped
    ports:
      # Always give an explicit host IP: a bare "3001:3000" also listens on IPv6 ([::]),
      # which can expose the board to the internet. 0.0.0.0 = IPv4 only, any interface.
      # BIND_IP (in .env next to this file) can narrow it to one address.
      - "${BIND_IP:-0.0.0.0}:3001:3000"
    environment:
      DISPLAY_MODE: web
      # Set DEBUG=1 to enable verbose per-trip logging
      # DEBUG: 1
      POLL_INTERVAL_MS: 30000
      DEPARTURES_PER_STOP: 10
      DEPARTURES_WINDOW_MINUTES: 90
      GTFS_REFRESH_INTERVAL_MS: 86400000

      # Stop config lives in src/config/stops.js — edit there, not here
    dns:
      - 1.1.1.1
      - 8.8.8.8
